# =============================================================================
# Docker Compose – xnapify (xnapify)
# =============================================================================
# Usage:
#   docker compose -f .docker/docker-compose.yml up
#
# Override per-environment settings by creating docker-compose.override.yml
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Application
  # ---------------------------------------------------------------------------
  xnapify:
    build:
      context: ..
      dockerfile: .docker/Dockerfile
    container_name: xnapify-app
    restart: unless-stopped
    ports:
      - '${XNAPIFY_PORT:-1337}:1337'
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      XNAPIFY_HOST: 0.0.0.0
      XNAPIFY_DB_TYPE: ${XNAPIFY_DB_TYPE:-sqlite}
      # Writable directories — all under /app/data (single persistent volume)
      XNAPIFY_UPLOAD_DIR: /app/data/uploads
      XNAPIFY_NODERED_HOME: /app/data/node-red
      XNAPIFY_EXTENSION_DIR: /app/data/extensions
      XNAPIFY_CACHE_DIR: /app/data/caches
      XNAPIFY_SQLITE_DATA_DIR: /app/data/sqlite
      XNAPIFY_PG_DATA_DIR: /app/data/postgres
      XNAPIFY_MYSQL_DATA_DIR: /app/data/mysql
      XNAPIFY_QUEUE_DATA_DIR: /app/data/queues
      # Shared backend — required when XNAPIFY_CLUSTER_WORKERS > 1
      XNAPIFY_CLUSTER_WORKERS: ${XNAPIFY_CLUSTER_WORKERS:-1}
      XNAPIFY_REDIS_URL: ${XNAPIFY_REDIS_URL:-redis://redis:6379/0}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - xnapify_data:/app/data
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:1337/api/ready']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Redis — shared cache, rate limits, session revocation, WebSocket fan-out
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: xnapify-redis
    restart: unless-stopped
    command: ['redis-server', '--save', '60', '1', '--appendonly', 'yes']
    volumes:
      - xnapify_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

# =============================================================================
# Volumes
# =============================================================================
volumes:
  xnapify_data:
  xnapify_redis:
