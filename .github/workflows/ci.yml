name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    # Job level so the coverage step's `if:` can test it — a step cannot read
    # its own `env:` block from its own condition.
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install all dependencies
        run: npm run setup

      # Reported, not gated. Every current `high` advisory reaches us through
      # Node-RED's bundled npm CLI (@npmcli/*, pacote, sigstore, libnpm*), and
      # npm's own remediation for that chain is a @node-red/runtime DOWNGRADE,
      # so there is no clean fix to apply. Keep the report visible here and let
      # the `critical` gate below decide whether the pipeline stops.
      # Re-evaluate when @node-red/runtime ships a patched npm CLI.
      - name: Audit production dependencies (report only)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - name: Fail on critical production vulnerabilities
        run: npm audit --omit=dev --audit-level=critical

      - name: Lint code
        run: npm run lint

      - name: Run tests
        run: npm test -- --coverage

      # codecov-action v4 requires an upload token. Set the CODECOV_TOKEN repo
      # secret to enable uploads; when it is unset the step is skipped rather
      # than failing or being silently rate-limited.
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.node-version == '20.x' && env.CODECOV_TOKEN != ''
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'

      - name: Install all dependencies
        run: npm run setup

      - name: Build application
        run: npm run build

      - name: Check build output
        run: |
          test -f build/server.js || { echo "❌ Missing build/server.js"; exit 1; }
          # The production image installs from build/, so it must ship its own
          # lockfile — without it `npm run setup` silently degrades to
          # `npm install` and two images from one commit can differ.
          test -f build/package-lock.json || { echo "❌ Missing build/package-lock.json"; exit 1; }
          ls build/public/assets*/client.*.js >/dev/null 2>&1 || { echo "❌ Missing client bundle"; exit 1; }
          echo "✅ Build successful"
